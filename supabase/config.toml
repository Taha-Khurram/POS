# Local Supabase stack. `supabase start` reads this; CI uses `supabase db start`
# followed by `supabase test db`.
#
# The two settings that are not defaults are the ones that matter most:
#   - auth.enable_signup = false        → nobody can create an account but us
#   - auth.hook.custom_access_token     → stamps tenant_id/platform_role claims
#
# Both must ALSO be set in the hosted project, from the Dashboard. This file
# only governs the local stack.

project_id = "flo"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

# Catches the invite and recovery emails locally instead of sending them.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

# Payment screenshots from /order/[ref]. Private: the only readers are you, in
# the verification queue, through a signed URL.
[storage.buckets.payment-proofs]
public = false
file_size_limit = "5MiB"
allowed_mime_types = ["image/png", "image/jpeg", "image/webp", "application/pdf"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# §3.3 layer 1. With this off, POST /auth/v1/signup returns 422 even when called
# directly with the publishable key. Accounts come from the console only.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

# Required on your own account (§3.7). Free.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
